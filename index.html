<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Flutter app dev">
<meta name="keywords" content="Flutter,mobile,dev,firebase">

<link rel="icon" type="image/png" href="logo/icon-a-64.png">
<link rel="apple-touch-icon" href="logo/icon-a.png">

<meta property="og:type" content="website">
<meta property="og:title" content="APPTAKK">
<meta property="og:description" content="Flutter app dev">
<meta property="og:image" content="https://apptakk.com/logo/og-image.png">
<meta property="og:url" content="https://apptakk.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="APPTAKK">
<meta name="twitter:description" content="Flutter app dev">
<meta name="twitter:image" content="https://apptakk.com/logo/og-image.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="content">

	<header class="hero">
		<h1>APPTAKK</h1>
		<p class="tagline">Some projects by me</p>
		<nav class="links" aria-label="Find me online">
			<a href="https://apps.apple.com/developer/erlend-madsen/id483924215" target="_blank" rel="noopener noreferrer">App Store</a>
			<a href="https://play.google.com/store/apps/developer?id=AppTakk" target="_blank" rel="noopener noreferrer">Google Play</a>
			<a href="https://github.com/erf" target="_blank" rel="noopener noreferrer">GitHub</a>
			<a href="https://pub.dev/publishers/apptakk.com/packages" target="_blank" rel="noopener noreferrer">pub.dev</a>
			<a href="https://medium.com/@erlendf" target="_blank" rel="noopener noreferrer">Medium</a>
		</nav>
	</header>

	<section aria-labelledby="apps-heading">
		<h2 class="section" id="apps-heading">Apps</h2>
		<div class="projects" id="apps-list"></div>
	</section>

	<section aria-labelledby="repos-heading">
		<h2 class="section" id="repos-heading">Open source</h2>
		<div class="projects" id="repo-list"></div>
	</section>

	<footer class="footer">
		Get in touch via email at <a href="mailto:apptakk@gmail.com">apptakk@gmail.com</a>
	</footer>

</main>

<script src="elite.js"></script>
<script src="data.js"></script>

<script>

	function destination(src) {
		const host = new URL(src).hostname;
		return ({
			'apps.apple.com': 'App Store',
			'play.google.com': 'Google Play',
			'www.youtube.com': 'Video',
			'github.com': 'GitHub',
			'pub.dev': 'pub.dev',
		})[host] || 'Website';
	}

	function build(data) {
		return data.map((repo) => el('article', '', { class: 'project' }, [
			el('h3', repo.name),
			el('p', repo.description, { class: 'description' }),
			el('div', '', { class: 'project-links' }, repo.urls.map((url) =>
				el('a', '', {
					href: url.src,
					target: '_blank',
					rel: 'noopener noreferrer',
					'aria-label': `${repo.name} — ${destination(url.src)} (opens in a new tab)`,
				}, [
					el('img', '', { class: 'icon', src: url.icon, alt: '', width: '16', height: '16' }),
					el('span', destination(url.src)),
				])
			))
		]));
	}

	set('apps-list', build(apps));
	set('repo-list', build(repos));

</script>
</body>
</html>
